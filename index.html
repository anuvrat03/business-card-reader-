<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card Extractor v5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 sm:p-6">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-600">Card Details Extractor</h1>
            <p class="text-xs sm:text-sm text-slate-500">Clean, structured field extraction</p>
        </header>

        <!-- Step 1: Paste Text -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <label class="block text-xs font-semibold uppercase tracking-wider text-blue-600">1. Paste card text</label>
            <textarea id="rawTextInput" rows="3" class="w-full p-3 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Paste card text here..."></textarea>
            <div class="flex gap-2">
                <button onclick="processText()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg text-sm transition">Extract Fields</button>
                <button onclick="clearAll()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 px-4 rounded-lg text-sm transition">Clear</button>
            </div>
        </section>

        <!-- Step 2: Upload Photo -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <label class="block text-xs font-semibold uppercase tracking-wider text-blue-600">2. ...or upload a card photo</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" onchange="handleImageUpload(event)">
            <div id="ocrStatus" class="text-xs text-slate-500 italic hidden">Scanning image with OCR... Please wait.</div>
            <!-- Hidden Canvas for Image Enhancement -->
            <canvas id="imageCanvas" class="hidden"></canvas>
        </section>

        <!-- Step 3: Extracted Details -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-semibold uppercase tracking-wider text-blue-600">3. Extracted details (editable)</label>
                <!-- Upload Next Card Button -->
                <button onclick="resetForNextCard()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold text-xs py-1.5 px-3 rounded-lg border border-blue-200 transition flex items-center gap-1">
                    🔄 Upload Next Card
                </button>
            </div>
            
            <!-- Name -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Name</label>
                <input type="text" id="fieldName" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Person name">
            </div>

            <!-- Company -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Company Name</label>
                <input type="text" id="fieldCompany" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Company / Organization">
            </div>

            <!-- Designation -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Designation / Role</label>
                <input type="text" id="fieldDesignation" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Job title / Role">
            </div>

            <!-- Address -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Address</label>
                <textarea id="fieldAddress" rows="2" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Street address, city, PIN/ZIP"></textarea>
            </div>

            <!-- Email -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
                <input type="text" id="fieldEmail" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Email address">
            </div>

            <!-- Mobile -->
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Mobile</label>
                <input type="text" id="fieldMobile" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Phone / mobile number">
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-2 pt-2">
                <button onclick="copyAll()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2 px-3 rounded-lg transition">Copy All</button>
                <button onclick="shareData()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium py-2 px-3 rounded-lg transition">Share</button>
                <button onclick="saveContact()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2 px-3 rounded-lg transition">Save vCard (.vcf)</button>
            </div>
        </section>

        <footer class="text-center text-xs text-slate-400 pb-4">
            Runs locally in your browser — no data leaves your device.
        </footer>
    </div>

    <!-- JavaScript Processing & Preprocessing Logic -->
    <script>
        function processText() {
            const rawText = document.getElementById('rawTextInput').value;
            if (!rawText.trim()) return;

            const lines = rawText.split('\n')
                .map(l => l.trim())
                .filter(l => {
                    if (l.length < 3) return false;
                    const letters = (l.match(/[a-zA-Z]/g) || []).length;
                    const symbols = (l.match(/[^a-zA-Z0-9\s]/g) || []).length;
                    if (symbols > letters) return false;
                    return true;
                });
            
            let name = "";
            let company = "";
            let designation = "";
            let addressLines = [];
            let email = "";
            let mobile = "";

            const emailRegex = /[\w.-]+@[\w.-]+\.\w+/;
            const mobileRegex = /(\+?\d{1,3}[-.\s]?)?\(?\d{2,4}\)?[-.\s]?\d{3,5}[-.\s]?\d{4}/;
            
            const companyKeywords = ['pvt', 'ltd', 'limited', 'corp', 'corporation', 'technologies', 'solutions', 'associates', 'enterprises', 'publication', 'industries', 'group', 'services', 'marketing', 'consultants'];
            const titleKeywords = ['manager', 'director', 'founder', 'ceo', 'partner', 'consultant', 'executive', 'officer', 'president', 'lead', 'head', 'editor', 'author'];
            const addressKeywords = ['road', 'rd', 'street', 'st', 'nagar', 'colony', 'floor', 'block', 'opp', 'near', 'lane', 'avenue', 'h.no', 'flat', 'plot', 'district', 'telangana', 'hyderabad', 'bengaluru', 'delhi', 'mumbai', 'pin', 'zip', 'off:'];

            lines.forEach((line) => {
                const lower = line.toLowerCase();

                if (emailRegex.test(line)) {
                    const match = line.match(emailRegex);
                    if (match) email = match[0];
                    return;
                }

                if (mobileRegex.test(line) && !addressKeywords.some(k => lower.includes(k))) {
                    const match = line.match(mobileRegex);
                    if (match && !mobile) mobile = match[0];
                    return;
                }

                const isCompany = companyKeywords.some(kw => lower.includes(kw));
                if (isCompany && !company) {
                    company = line;
                    return;
                }

                const isTitle = titleKeywords.some(kw => lower.includes(kw));
                if (isTitle && !designation) {
                    designation = line;
                    return;
                }

                const isAddress = addressKeywords.some(kw => lower.includes(kw)) || /\b\d{6}\b/.test(line);
                if (isAddress || (addressLines.length > 0 && !name)) {
                    addressLines.push(line);
                    return;
                }

                if (!name && line.length < 30 && !/\d/.test(line) && !isCompany && !isTitle) {
                    name = line;
                } else if (!addressLines.length && !company) {
                    company = line;
                } else {
                    addressLines.push(line);
                }
            });

            document.getElementById('fieldName').value = name;
            document.getElementById('fieldCompany').value = company;
            document.getElementById('fieldDesignation').value = designation;
            document.getElementById('fieldAddress').value = addressLines.join(', ');
            document.getElementById('fieldEmail').value = email;
            document.getElementById('fieldMobile').value = mobile;
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('ocrStatus');
            statusEl.classList.remove('hidden');
            statusEl.innerText = "Preprocessing image & removing background...";

            // Preprocess image to grayscale and increase contrast to eliminate table background noise
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async function() {
                const canvas = document.getElementById('imageCanvas');
                const ctx = canvas.getContext('2d');
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    // Grayscale conversion
                    let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    // High contrast filter to make text pop and background white
                    let contrast = avg > 140 ? 255 : 0; 
                    data[i] = contrast;
                    data[i + 1] = contrast;
                    data[i + 2] = contrast;
                }
                ctx.putImageData(imgData, 0, 0);

                statusEl.innerText = "Recognizing text with Tesseract OCR...";
                try {
                    const { data: { text } } = await Tesseract.recognize(canvas, 'eng', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                statusEl.innerText = `OCR Progress: ${Math.round(m.progress * 100)}%`;
                            }
                        }
                    });

                    document.getElementById('rawTextInput').value = text;
                    processText();
                    statusEl.innerText = "Text extracted successfully!";
                    setTimeout(() => statusEl.classList.add('hidden'), 3000);
                } catch (error) {
                    statusEl.innerText = "Error scanning image. Please try pasting text manually.";
                }
            };
        }

        function clearAll() {
            document.getElementById('rawTextInput').value = '';
            document.getElementById('fieldName').value = '';
            document.getElementById('fieldCompany').value = '';
            document.getElementById('fieldDesignation').value = '';
            document.getElementById('fieldAddress').value = '';
            document.getElementById('fieldEmail').value = '';
            document.getElementById('fieldMobile').value = '';
            document.getElementById('imageInput').value = '';
        }

        function resetForNextCard() {
            clearAll();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyAll() {
            const summary = `Name: ${document.getElementById('fieldName').value}\nCompany: ${document.getElementById('fieldCompany').value}\nDesignation: ${document.getElementById('fieldDesignation').value}\nAddress: ${document.getElementById('fieldAddress').value}\nEmail: ${document.getElementById('fieldEmail').value}\nMobile: ${document.getElementById('fieldMobile').value}`;
            navigator.clipboard.writeText(summary);
            alert('Copied to clipboard!');
        }

        function shareData() {
            const summary = `Name: ${document.getElementById('fieldName').value}\nMobile: ${document.getElementById('fieldMobile').value}\nEmail: ${document.getElementById('fieldEmail').value}`;
            if (navigator.share) {
                navigator.share({ title: 'Extracted Card Details', text: summary });
            } else {
                copyAll();
            }
        }

        function saveContact() {
            const name = document.getElementById('fieldName').value || 'Contact';
            const mobile = document.getElementById('fieldMobile').value;
            const email = document.getElementById('fieldEmail').value;
            const org = document.getElementById('fieldCompany').value;
            const addr = document.getElementById('fieldAddress').value;

            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTEL:${mobile}\nEMAIL:${email}\nADR:;;${addr};;;;\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_')}.vcf`;
            a.click();
        }
    </script>
</body>
</html>
