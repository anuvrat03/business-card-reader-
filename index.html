<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Business Card Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-3 sm:p-6">
    <div class="max-w-xl mx-auto space-y-6">
        
        <!-- Header -->
        <header class="text-center">
            <h1 class="text-xl sm:text-2xl font-bold text-blue-600">AI Card Extractor</h1>
            <p class="text-xs sm:text-sm text-slate-500">Zero-friction smart extraction using AI Vision</p>
        </header>

        <!-- API Key Setup Box -->
        <section class="bg-blue-50 border border-blue-200 p-3 rounded-xl space-y-2">
            <label class="block text-xs font-semibold text-blue-700">OpenRouter API Key (Saved on device)</label>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="Paste your sk-or-v1... key here" class="w-full text-xs p-2 bg-white border border-blue-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button onclick="saveApiKey()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition whitespace-nowrap">Save Key</button>
            </div>
        </section>

        <!-- Step 1: Upload Photo -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-3">
            <label class="block text-xs font-semibold uppercase tracking-wider text-blue-600">1. Snap or Upload Card Photo</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" onchange="handleAIImageUpload(event)">
            <div id="statusText" class="text-xs text-blue-600 font-medium italic hidden">Analyzing card with AI Vision... Please wait.</div>
        </section>

        <!-- Step 2: Extracted Details -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
            <div class="flex justify-between items-center">
                <label class="block text-xs font-semibold uppercase tracking-wider text-blue-600">2. Extracted Details (AI Verified)</label>
                <button onclick="resetForNextCard()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 font-semibold text-xs py-1.5 px-3 rounded-lg border border-blue-200 transition flex items-center gap-1">
                    🔄 Upload Next Card
                </button>
            </div>
            
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Name</label>
                <input type="text" id="fieldName" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Person name">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Company Name</label>
                <input type="text" id="fieldCompany" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Company / Organization">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Designation / Role</label>
                <input type="text" id="fieldDesignation" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Job title / Role">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Address</label>
                <textarea id="fieldAddress" rows="2" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Street address, city, PIN/ZIP"></textarea>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
                <input type="text" id="fieldEmail" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Email address">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">Mobile</label>
                <input type="text" id="fieldMobile" class="w-full p-2.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Phone / mobile number">
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-2 pt-2">
                <button onclick="copyAll()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2 px-3 rounded-lg transition">Copy All</button>
                <button onclick="saveContact()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium py-2 px-3 rounded-lg transition">Save vCard (.vcf)</button>
            </div>
        </section>

        <footer class="text-center text-xs text-slate-400 pb-4">
            Powered by AI Vision & OpenRouter — runs seamlessly.
        </footer>
    </div>

    <!-- Script -->
    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('openrouter_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('Please paste a valid API key first.');
                return;
            }
            localStorage.setItem('openrouter_api_key', key);
            alert('API Key saved securely on your device!');
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        async function handleAIImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const apiKey = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('openrouter_api_key');
            if (!apiKey) {
                alert('Please enter and save your OpenRouter API key at the top first!');
                return;
            }

            const statusEl = document.getElementById('statusText');
            statusEl.classList.remove('hidden');
            statusEl.innerText = "Analyzing card with AI Vision...";

            try {
                const base64Image = await fileToBase64(file);

                const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        "model": "google/gemini-flash-1.5", // Updated to stable supported model name
                        "messages": [
                            {
                                "role": "user",
                                "content": [
                                    {
                                        "type": "text",
                                        "text": "Extract details from this business card into strict JSON format with exactly these keys: name, company, designation, address, email, mobile. If a field is missing, return an empty string."
                                    },
                                    {
                                        "type": "image_url",
                                        "image_url": { "url": base64Image }
                                    }
                                ]
                            }
                        ],
                        "response_format": { "type": "json_object" }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message || 'API Error');
                }

                if (data.choices && data.choices[0].message.content) {
                    let content = data.choices[0].message.content;
                    // Clean markdown code blocks if returned by model
                    content = content.replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(content);

                    document.getElementById('fieldName').value = result.name || '';
                    document.getElementById('fieldCompany').value = result.company || '';
                    document.getElementById('fieldDesignation').value = result.designation || '';
                    document.getElementById('fieldAddress').value = result.address || '';
                    document.getElementById('fieldEmail').value = result.email || '';
                    document.getElementById('fieldMobile').value = result.mobile || '';
                    statusEl.innerText = "Extracted successfully!";
                } else {
                    throw new Error('Invalid response structure');
                }

                setTimeout(() => statusEl.classList.add('hidden'), 3000);
            } catch (error) {
                statusEl.innerText = "Error: " + error.message;
                console.error(error);
            }
        }

        function resetForNextCard() {
            document.getElementById('fieldName').value = '';
            document.getElementById('fieldCompany').value = '';
            document.getElementById('fieldDesignation').value = '';
            document.getElementById('fieldAddress').value = '';
            document.getElementById('fieldEmail').value = '';
            document.getElementById('fieldMobile').value = '';
            document.getElementById('imageInput').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function copyAll() {
            const summary = `Name: ${document.getElementById('fieldName').value}\nCompany: ${document.getElementById('fieldCompany').value}\nDesignation: ${document.getElementById('fieldDesignation').value}\nAddress: ${document.getElementById('fieldAddress').value}\nEmail: ${document.getElementById('fieldEmail').value}\nMobile: ${document.getElementById('fieldMobile').value}`;
            navigator.clipboard.writeText(summary);
            alert('Copied to clipboard!');
        }

        function saveContact() {
            const name = document.getElementById('fieldName').value || 'Contact';
            const mobile = document.getElementById('fieldMobile').value;
            const email = document.getElementById('fieldEmail').value;
            const org = document.getElementById('fieldCompany').value;
            const addr = document.getElementById('fieldAddress').value;

            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${org}\nTEL:${mobile}\nEMAIL:${email}\nADR:;;${addr};;;;\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_')}.vcf`;
            a.click();
        }
    </script>
</body>
</html>
